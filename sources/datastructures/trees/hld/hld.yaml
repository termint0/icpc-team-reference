name: Heavy-light decomposition
description: For a rooted tree given as adjacency lists. pos[v] is the index of v so that each heavy path
  and each subtree is a contiguous range; path(u, v) returns O(log n) half-open ranges covering the u-v
  path and subtree(v) one range. Combine with a segment tree / Fenwick tree over pos for path and subtree
  queries. Also gives lca.
time:
  build: O(n)
  path: O(log(n))
  lca: O(log(n))
  path query with segment tree: O(log^2(n))
memory: O(n)
