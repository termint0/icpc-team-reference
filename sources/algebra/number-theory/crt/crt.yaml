name: Chinese remainder theorem
description: crt(a1, m1, a2, m2) solves x = a1 (mod m1), x = a2 (mod m2) for arbitrary (not necessarily
  coprime) moduli and returns (x, lcm(m1, m2)) or None if there is no solution. crt_list folds it over
  many congruences.
time:
  crt: O(log(m))
  crt_list: O(k*log(M))
memory: O(1)
