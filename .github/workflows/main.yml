name: Build PDF

on:
  push:
    tags: ["v*"]          # releases on version tags
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release with the PDF"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v1.0.0), required if releasing"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures

      - name: Build PDF
        run: |
          python build.py sources \
            -o algorithms \
            --institution "University of Twente" \
            $([ -f cover.tex ] && echo "--cover cover.tex")

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: algorithms-pdf
          path: algorithms.pdf
          if-no-files-found: error

      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: algorithms.log
          if-no-files-found: ignore

  release:
    needs: build
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: algorithms-pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: algorithms.pdf
          generate_release_notes: true
